Slug: synfrag-accessibility
Status: In progress
Title: SynFrag Synthetic Accessibility
Description: Scores how easily a molecule can be synthesized, from its SMILES 
  alone. SynFrag pretrains an AttentiveFP graph network on 9.18 million 
  unlabelled molecules by rebuilding them fragment by fragment, then finetunes 
  it on 800, 000 molecules labelled easy or hard to make with the Retro* 
  planner. Higher values mean easier synthesis. The authors tested it on public 
  benchmarks, clinical drugs and AI-generated molecules; scores are not 
  calibrated probabilities.
